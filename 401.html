<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed Out — Agricola Draft Tool</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f3ef;
            color: #333;
        }
        .panel {
            max-width: 460px;
            padding: 32px 36px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
        h1 { font-size: 1.4em; margin: 0 0 12px; }
        p { line-height: 1.5; color: #666; margin: 0 0 20px; }
        .actions { display: flex; gap: 12px; justify-content: center; }
        a.btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.95em;
        }
        a.primary { background: #6b8e4e; color: #fff; }
        a.secondary { background: #eee; color: #444; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>You're signed out</h1>
        <p>That page needs a signed-in session. Nothing on the draft tool itself is
           restricted — only saving drafts to the cloud requires an account.</p>
        <div class="actions">
            <a class="btn primary" href="/draft.html">Back to the draft tool</a>
            <a class="btn secondary" href="/.auth/login/github?post_login_redirect_uri=/draft.html">Sign in</a>
        </div>
    </div>
    <script>
        // Azure SWA's own /.auth/* endpoints 401 mid-redirect when the session is
        // already gone (e.g. signing out twice). There is nothing for the user to
        // act on there, so bounce straight back to the draft tool.
        if (window.location.pathname.indexOf('/.auth/') === 0) {
            window.location.replace('/draft.html');
        }
    </script>
</body>
</html>
